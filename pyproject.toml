[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bilibili-cli"
version = "0.1.0"
description = "Agent-ready Bilibili CLI with API-first commands and browser fallback."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Youhai", email = "youhai020616@gmail.com" }]
keywords = ["bilibili", "bili", "cli", "automation", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.27.0",
    "playwright>=1.40",
    "browser-cookie3>=0.19",
    "PyYAML>=6.0",
]

[project.scripts]
bili = "bili_cli.main:cli"

[project.urls]
Homepage = "https://github.com/Youhai020616/bilibili_cli"
Repository = "https://github.com/Youhai020616/bilibili_cli"
Issues = "https://github.com/Youhai020616/bilibili_cli/issues"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/bili_cli"]
